# Spiel-Server von Overnight 2: Konten (D1) und ein Durable Object pro Gebiet.
name = "overnight2"
main = "worker/index.js"
compatibility_date = "2026-10-01"

[vars]
# Seiten, die mit dem Server sprechen dürfen (Komma-getrennt).
ALLOWED_ORIGINS = "https://poffel5657.github.io,http://127.0.0.1:4180,http://localhost:4180"

[[d1_databases]]
binding = "DB"
database_name = "overnight2"
# Angelegt am 2026-11-10 (wrangler d1 create overnight2).
database_id = "d0ae0d79-49f3-4552-a5d3-beef6f82944f"
migrations_dir = "migrations"

# Ein Raum pro Gebiet, mit SQLite-Speicher (im kostenlosen Plan nur so möglich).
[[durable_objects.bindings]]
name = "REGION"
class_name = "RegionRoom"

[[migrations]]
tag = "v1-region"
new_sqlite_classes = ["RegionRoom"]

# Anmeldeversuche pro IP begrenzen.
[[ratelimits]]
name = "AUTH_LIMIT"
namespace_id = "2001"
simple = { limit = 10, period = 60 }
