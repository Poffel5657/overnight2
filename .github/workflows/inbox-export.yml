# Holt am Abend (Berlin, bis spätestens 22:59, vor dem Start des Nachtlaufs um 23 Uhr) die neuen Gebete, den Stand der Abstimmung
# und ein paar Zahlen vom Server und legt sie als eine Datei pro Nacht ins private Repo overnight-inbox (v2/inbox/YYYY-MM-DD.json).
# GitHub startet Cron-Läufe oft stark verspätet oder gar nicht (Tag 1 und 2). Deshalb läuft der Export mehrmals am Abend
# und überschreibt jedes Mal die Datei des Tages; "since" kommt aus der letzten Datei VOR heute, damit nichts verloren geht.
# Der Nachtlauf liest nur diese Dateien, nie die Datenbank. Gebetstext ist fremder Text
# (Feld untrustedPlayerText); Spielernamen werden nicht übernommen.
# Braucht die Secrets ADMIN_KEY (wie im Worker) und INBOX_TOKEN (fein granularer Token, nur
# "Contents: Read and write" auf Poffel5657/overnight-inbox).
name: Inbox export

on:
  schedule:
    # Alle 30 Minuten von 16:17 bis 21:47 UTC (krumme Minuten, weil GitHub volle Stunden oft auslässt).
    # Das Skript arbeitet nur zwischen 17 und 22:59 Uhr Berlin, egal ob Sommer- oder Winterzeit.
    - cron: '17,47 16-21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Uhrzeit nicht prüfen (zum Testen)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: inbox-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exportieren
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          GH_TOKEN: ${{ secrets.INBOX_TOKEN }}
          SERVER: https://overnight2.overnight-rpg.workers.dev
          INBOX: Poffel5657/overnight-inbox
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          hour=$(TZ=Europe/Berlin date +%H)
          if [ "$FORCE" != "true" ] && { [ "$hour" -lt 17 ] || [ "$hour" -gt 22 ]; }; then echo "Nicht zwischen 17 und 23 Uhr in Berlin ($hour Uhr), nichts zu tun."; exit 0; fi
          today=$(TZ=Europe/Berlin date +%F)

          # Zugang zum Inbox-Repo zuerst prüfen, damit ein falscher Token eine klare Meldung gibt.
          gh api "repos/$INBOX" --jq .full_name > /dev/null || { echo "::error::INBOX_TOKEN hat keinen Zugriff auf $INBOX (leer, abgelaufen oder falsches Repo)."; exit 1; }
          # Bis wohin hat der letzte Export eines FRÜHEREN Abends gelesen? (Feld until; Ordner fehlt beim ersten Mal)
          # Die Datei von heute zählt nicht: sie wird bei jedem Lauf am Abend neu geschrieben.
          latest=""
          if listing=$(gh api "repos/$INBOX/contents/v2/inbox" 2>/dev/null); then
            latest=$(echo "$listing" | jq -r --arg today "$today.json" '[.[] | select(.name | test("^[0-9-]+\\.json$")) | .name | select(. < $today)] | sort | last // empty')
          fi
          since=0
          if [ -n "$latest" ]; then
            since=$(gh api "repos/$INBOX/contents/v2/inbox/$latest" -H 'Accept: application/vnd.github.raw' | jq '.until // 0')
          fi
          ballot=$(node -e "import('./content/ballot.js').then((m) => console.log(m.BALLOT.day))")

          curl -fsS -H "X-Admin-Key: $ADMIN_KEY" "$SERVER/api/admin/inbox?since=$since&ballot=$ballot" > raw.json
          jq --arg date "$today" --argjson since "$since" --argjson ballot "$ballot" '{
            date: $date,
            since: $since,
            until: ([.prayers[].created_at] | max // $since),
            ballot: $ballot,
            prayers: [.prayers[] | { id, date, untrustedPlayerText: .text }],
            votes: .votes,
            beacon: .beacon,
            players: .players
          }' raw.json > export.json
          echo "Gebete: $(jq '.prayers | length' export.json), Stimmen: $(jq '[.votes[].votes] | add // 0' export.json)"

          path="v2/inbox/$today.json"
          sha=$(gh api "repos/$INBOX/contents/$path" --jq .sha 2>/dev/null || true)
          args=(-X PUT "repos/$INBOX/contents/$path" -f message="Inbox $today" -f content="$(base64 -w0 export.json)"
            -f "committer[name]=Poffel5657" -f "committer[email]=224543538+Poffel5657@users.noreply.github.com")
          [ -n "$sha" ] && args+=(-f sha="$sha")
          gh api "${args[@]}" > /dev/null
          echo "Gespeichert: $INBOX/$path"
