# Holt kurz vor Mitternacht die neuen Gebete, den Stand der Abstimmung und ein paar Zahlen vom Server
# und legt sie als eine Datei pro Nacht ins private Repo overnight-inbox (v2/inbox/YYYY-MM-DD.json).
# Der Nachtlauf liest nur diese Dateien, nie die Datenbank. Gebetstext ist fremder Text
# (Feld untrustedPlayerText); Spielernamen werden nicht übernommen.
# Braucht die Secrets ADMIN_KEY (wie im Worker) und INBOX_TOKEN (fein granularer Token, nur
# "Contents: Read and write" auf Poffel5657/overnight-inbox).
name: Inbox export

on:
  schedule:
    # 22:40 und 21:40 UTC, je nach Sommer- oder Winterzeit ist eins davon 23:40 Uhr in Berlin.
    - cron: '40 22 * * *'
    - cron: '40 21 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Uhrzeit nicht prüfen (zum Testen)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: inbox-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Exportieren
        env:
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          GH_TOKEN: ${{ secrets.INBOX_TOKEN }}
          SERVER: https://overnight2.overnight-rpg.workers.dev
          INBOX: Poffel5657/overnight-inbox
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          hour=$(TZ=Europe/Berlin date +%H)
          if [ "$FORCE" != "true" ] && [ "$hour" != "23" ]; then echo "Nicht 23 Uhr in Berlin ($hour), nichts zu tun."; exit 0; fi
          today=$(TZ=Europe/Berlin date +%F)

          # Bis wohin hat der letzte Export gelesen? (Feld until in der neuesten Datei)
          latest=$(gh api "repos/$INBOX/contents/v2/inbox" --jq '[.[] | select(.name | test("^[0-9-]+\\.json$")) | .name] | sort | last // empty' 2>/dev/null || true)
          since=0
          if [ -n "$latest" ]; then
            since=$(gh api "repos/$INBOX/contents/v2/inbox/$latest" -H 'Accept: application/vnd.github.raw' | jq '.until // 0')
          fi
          ballot=$(node -e "import('./content/ballot.js').then((m) => console.log(m.BALLOT.day))")

          curl -fsS -H "X-Admin-Key: $ADMIN_KEY" "$SERVER/api/admin/inbox?since=$since&ballot=$ballot" > raw.json
          jq --arg date "$today" --argjson since "$since" --argjson ballot "$ballot" '{
            date: $date,
            since: $since,
            until: ([.prayers[].created_at] | max // $since),
            ballot: $ballot,
            prayers: [.prayers[] | { id, date, untrustedPlayerText: .text }],
            votes: .votes,
            beacon: .beacon,
            players: .players
          }' raw.json > export.json
          echo "Gebete: $(jq '.prayers | length' export.json), Stimmen: $(jq '[.votes[].votes] | add // 0' export.json)"

          path="v2/inbox/$today.json"
          sha=$(gh api "repos/$INBOX/contents/$path" --jq .sha 2>/dev/null || true)
          args=(-X PUT "repos/$INBOX/contents/$path" -f message="Inbox $today" -f content="$(base64 -w0 export.json)"
            -f "committer[name]=Poffel5657" -f "committer[email]=224543538+Poffel5657@users.noreply.github.com")
          [ -n "$sha" ] && args+=(-f sha="$sha")
          gh api "${args[@]}" > /dev/null
          echo "Gespeichert: $INBOX/$path"
